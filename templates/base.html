<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClipForge Tools{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>
    <header class="site-header">
        <div class="container">
            <div class="brand-wrap">
                <a class="brand" href="/">ClipForge Tools</a>
                <p class="subtitle">面向 Amazon 与 YouTube 的 AI 工具视频生成平台</p>
            </div>
            <nav class="nav">
                <a href="/">新建任务</a>
                <a href="/jobs">任务列表</a>
            </nav>
        </div>
    </header>
    <main class="container page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
