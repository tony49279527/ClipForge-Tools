name: PostgreSQL Integration

on:
  push:
    branches:
      - clipforge-v3-real-provider-alpha
  pull_request:
    branches:
      - clipforge-v3-real-provider-alpha

jobs:
  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clipforge_test
          POSTGRES_PASSWORD: clipforge_test_password
          POSTGRES_DB: clipforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipforge_test -d clipforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CLIPFORGE_V3_ENABLED: "true"
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://clipforge_test:clipforge_test_password@127.0.0.1:5432/clipforge_test
      DATABASE_STATEMENT_TIMEOUT_MS: "5000"
      SEEDANCE_PROVIDER: "ark"
      SEEDANCE_MODEL: "mock-seedance"
      SEEDANCE_BASE_URL: "https://example.invalid"
      SEEDANCE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: PostgreSQL repository integration tests
        timeout-minutes: 10
        run: python -m pytest -vv tests/v3/test_postgresql_integration.py
      - name: PostgreSQL migration rehearsal tests
        timeout-minutes: 10
        run: python -m pytest -vv tests/v3/test_database_migration_tools.py
      - name: SQLite V3 regression
        env:
          POSTGRES_TEST_DATABASE_URL: ""
        run: python -m pytest -q tests/v3
      - name: Legacy regression
        env:
          POSTGRES_TEST_DATABASE_URL: ""
        run: python -m pytest -q tests/test_legacy_routes.py
      - name: Compile check
        run: python -m compileall clipforge_v3 scripts/v3
